<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Prompt research matrix</title>
  <desc id="desc">A matrix for measuring informational, comparison and buying prompts.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="92" y="72" width="1016" height="531" rx="28" fill="#ffffff" stroke="#dbe4ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="142" text-anchor="middle" font-size="42" font-weight="800" fill="#0f172a">Prompt Matrix</text>
    <text x="600" y="180" text-anchor="middle" font-size="22" fill="#64748b">stable questions across models and buyer intent</text>
    <rect x="204" y="246" width="792" height="292" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M204 319 H996 M204 392 H996 M204 465 H996 M402 246 V538 M600 246 V538 M798 246 V538" stroke="#dbe4ee" stroke-width="3"/>
    <text x="303" y="291" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">Intent</text>
    <text x="501" y="291" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">ChatGPT</text>
    <text x="699" y="291" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">Gemini</text>
    <text x="897" y="291" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">AI Search</text>
    <text x="303" y="365" text-anchor="middle" font-size="20" fill="#334155">define</text>
    <text x="303" y="438" text-anchor="middle" font-size="20" fill="#334155">compare</text>
    <text x="303" y="511" text-anchor="middle" font-size="20" fill="#334155">choose</text>
