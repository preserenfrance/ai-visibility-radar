  <g fill="#22c55e">
    <circle cx="501" cy="359" r="14"/><circle cx="699" cy="432" r="14"/><circle cx="897" cy="505" r="14"/>
  </g>
  <g fill="#f97316">
    <circle cx="699" cy="359" r="14"/><circle cx="897" cy="432" r="14"/><circle cx="501" cy="505" r="14"/>
